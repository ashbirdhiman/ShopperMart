apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: shoppermart
type: Opaque
stringData:
  # ---------- MySQL ----------
  # Root user (admin)
  mysql-root-password: mysql

  # Application DB user (DO NOT use root)
  mysql-user: shoppermart
  mysql-password: shoppermart123

  # ---------- MongoDB ----------
  mongodb-user: root
  mongodb-password: password
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: shoppermart
type: Opaque
stringData:
  # Keycloak admin user
  keycloak-admin: admin
  keycloak-admin-password: admin

  # Keycloak database credentials
  db-user: keycloak
  db-password: keycloak
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: shoppermart
type: Opaque
stringData:
  # JWT signing key
  jwt-secret: your-jwt-secret-key-change-in-production

  # Internal API key
  api-key: your-api-key-change-in-production
