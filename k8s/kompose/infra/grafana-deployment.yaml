apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: shoppermart
data:
  grafana.ini: |
    [server]
    root_url = /grafana
    serve_from_sub_path = true
    [auth.anonymous]
    enabled = true
    org_role = Admin
    [security]
    admin_user = admin
    admin_password = admin
    disable_login_form = false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: shoppermart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.3.1
          ports:
            - containerPort: 3000
              name: grafana
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          volumeMounts:
            - name: storage
              mountPath: /var/lib/grafana
            - name: config
              mountPath: /etc/grafana
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: storage
          emptyDir: {}
        - name: config
          configMap:
            name: grafana-config
