replicas: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

env:
  GF_SERVER_ROOT_URL: http://192.168.47.133/grafana/
  GF_SERVER_SERVE_FROM_SUB_PATH: "true"

grafana.ini:
  server:
    root_url: http://192.168.47.133/grafana/
    serve_from_sub_path: true
  auth:
    anonymous:
      enabled: true
      org_role: Admin
    disable_login_form: true

ingress:
  enabled: false

adminPassword: admin
