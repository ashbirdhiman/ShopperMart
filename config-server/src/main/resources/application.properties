spring.application.name=config-server
server.port=8888
spring.profiles.active=default

spring.cloud.config.server.git.uri=https://github.com/ashbirdhiman/ShopperMart.git
spring.cloud.config.server.git.search-paths=configs
spring.cloud.config.server.default-application-name=application


# Eureka registration
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Health check - don't fail if Eureka is unavailable
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true