spring.application.name=Order-Service
server.port=8082

# Actuator & Prometheus
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoints.web.base-path=/actuator
management.metrics.export.prometheus.enabled=true

# MySQL Database Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/order_service
spring.datasource.username=root
spring.datasource.password=mysql

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Data initialization
spring.sql.init.mode=never

# Eureka Configuration
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Spring Cloud LoadBalancer Configuration
spring.cloud.loadbalancer.nacos.enabled=false
spring.cloud.loadbalancer.ribbon.enabled=false

# Enable Eureka discovery for Feign
spring.cloud.openfeign.discovery.enabled=true
spring.cloud.discovery.enabled=true

# Use Spring Cloud LoadBalancer instead of OkHttp
spring.cloud.loadbalancer.cache.enabled=true
feign.httpclient.enabled=false


spring.kafka.template.default-topic=order-placed
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoints.web.base-path=/actuator
management.prometheus.metrics.export.enabled=true