spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://user-service-mysql:3306/user_service?createDatabaseIfNotExist=true
    username: root
    password: mysql
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: on-create
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

server:
  port: 8084

# Eureka Client Configuration
eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
    prefer-ip-address: true

# Actuator & Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
      base-path: /actuator
  metrics:
    export:
      prometheus:
        enabled: true
